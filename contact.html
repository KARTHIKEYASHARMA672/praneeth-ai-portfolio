<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Contact — A. Praneeth Karthikeya Sharma</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="viewport"><div class="canvas-wrap"></div>
<div class="sec active" id="sec_contact">
  <div class="contact-grid">
    <div class="contact-card"><div class="k">Email</div><div class="v"><a href="mailto:karthikeyasharma299@gmail.com">karthikeyasharma299@gmail.com</a></div></div>
    <div class="contact-card"><div class="k">Phone</div><div class="v"><a href="tel:+919492623987">+91 949 262 3987</a></div></div>
    <div class="contact-card"><div class="k">Location</div><div class="v">Kadapa, Andhra Pradesh, India</div></div>
    <div class="contact-card"><div class="k">GitHub</div><div class="v"><a href="https://github.com/KARTHIKEYASHARMA672">github.com/KARTHIKEYASHARMA672</a></div></div>
  </div>
  <form class="contact-form" id="cf" onsubmit="return App.submitContact(this)">
    <div class="form-row"><label>Name</label><input name="name" required></div>
    <div class="form-row"><label>Email</label><input name="email" required type="email"></div>
    <div class="form-row"><label>Subject</label><select name="subject"><option>Project Inquiry</option><option>Collaboration</option><option>Job Opportunity</option><option>General Question</option><option>Other</option></select></div>
    <div class="form-row"><label>Message</label><textarea name="message" required></textarea></div>
    <div class="form-actions"><button type="submit">Send Message</button></div>
  </form>
</div>
</div>
<div class="modal-overlay"><div class="modal"><h3></h3><div class="mod-tag"></div><p class="mod-desc"></p><div class="mod-links"></div><button class="close" onclick="App.closeModal()">&times;</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/scene-contact.js"></script>
<script>
window.App.submitContact = function(f){ f.classList.add("ok"); setTimeout(function(){ f.reset(); alert("Message received. I'll be in touch soon!"); }, 300); return false; };
</script>
<script>scene_contact();</script>
</body>
</html>
